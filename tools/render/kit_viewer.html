<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>KayKit model viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1620; overflow: hidden; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "/tools/node_modules/three/build/three.module.js",
               "three/addons/": "/tools/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1620);
scene.add(new THREE.HemisphereLight(0xffffff, 0x33404d, 2.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(4, 7, 5);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fc7ff, 1.0);
fill.position.set(-5, 3, -4);
scene.add(fill);

const grid = new THREE.GridHelper(20, 20, 0x2a3a4a, 0x1a2530);
scene.add(grid);

const camera = new THREE.PerspectiveCamera(35, W / H, 0.01, 200);
const holder = new THREE.Group();
scene.add(holder);

const loader = new GLTFLoader();
window.__error = null;
window.__ready = false;

function frameObject(object, fillRatio = 0.72) {
  const box = new THREE.Box3().setFromObject(object);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.x, size.y, size.z) * 0.5;
  const distance = radius / Math.tan(THREE.MathUtils.degToRad(35 * 0.5)) / fillRatio;
  // three-quarter view from the front-right, slightly above
  const dir = new THREE.Vector3(0.72, 0.52, 0.95).normalize();
  camera.position.copy(center).addScaledVector(dir, distance);
  camera.lookAt(center);
  camera.near = Math.max(distance / 200, 0.01);
  camera.far = distance * 20;
  camera.updateProjectionMatrix();
  return { size: size.toArray(), center: center.toArray() };
}

window.showModel = async (url, opts = {}) => {
  try {
    holder.clear();
    const gltf = await new Promise((resolve, reject) => loader.load(url, resolve, undefined, reject));
    const model = gltf.scene;
    holder.add(model);
    const info = frameObject(model, opts.fill || 0.72);
    // The pack is authored Y-up with the origin at the base; keep the grid as a
    // ground reference so the pivot convention stays visible in every shot.
    window.__info = info;
    window.__ready = true;
    window.__error = null;
    return info;
  } catch (err) {
    window.__error = String(err);
    return null;
  }
};

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
