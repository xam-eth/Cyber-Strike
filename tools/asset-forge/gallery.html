<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Exocomplict · 3D Asset Forge</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --void: #05080c; --panel: #0b131b; --panel2: #111c26; --line: #27384a;
    --lineHi: #4e6a7e; --ink: #edf5fb; --ink2: #a9bccb; --accent: #ffb020;
    --info: #54c8ff; --ok: #37e08c; --danger: #ff5a5a;
    --ui: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--void); color: var(--ink); font-family: var(--ui); }
  #app { display: grid; grid-template-columns: 260px 1fr; height: 100%; }
  /* Capture mode: no sidebar, canvas fills the viewport, so a screenshot is
     exactly the render. The earlier version left the 260 px panel in the grid
     and the 720 px canvas overflowed it, which cropped every shot. */
  body.capture #app { grid-template-columns: 1fr; }
  body.capture #side { display: none; }
  body.capture #hud { display: none; }
  body.capture #top { display: none; }
  #side { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 12px; }
  h1 { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink2); margin: 0 0 10px; }
  .cat { font-size: 10px; letter-spacing: .16em; color: var(--lineHi); margin: 12px 0 4px; text-transform: uppercase; }
  button.item {
    display: block; width: 100%; text-align: left; background: transparent; color: var(--ink2);
    border: 1px solid transparent; padding: 5px 7px; font: inherit; font-size: 11px; cursor: pointer; border-radius: 3px;
  }
  button.item:hover { background: var(--panel2); color: var(--ink); }
  button.item.active { border-color: var(--info); color: var(--ink); background: var(--panel2); }
  #stage { position: relative; }
  canvas { display: block; }
  body.capture { overflow: hidden; margin: 0; }
  #hud {
    position: absolute; left: 14px; bottom: 12px; font-size: 11px; color: var(--ink2);
    background: rgba(11, 19, 27, .78); border: 1px solid var(--line); border-radius: 4px;
    padding: 8px 10px; line-height: 1.55; pointer-events: none; max-width: 60ch;
  }
  #hud b { color: var(--ink); font-weight: 600; }
  #hud .warn { color: var(--accent); }
  #top { position: absolute; inset: 12px 14px auto auto; display: flex; gap: 6px; }
  #top button {
    background: var(--panel); color: var(--ink2); border: 1px solid var(--line); border-radius: 3px;
    padding: 4px 8px; font: inherit; font-size: 11px; cursor: pointer;
  }
  #top button.on { border-color: var(--info); color: var(--ink); }
</style>
<script type="importmap">
{
  "imports": {
    "three": "/tools/asset-forge/vendor/three/three.module.js",
    "three/addons/": "/tools/asset-forge/vendor/three/addons/"
  }
}
</script>
</head>
<body>
<div id="app">
  <aside id="side"><h1>Asset Forge</h1><div id="list"></div></aside>
  <main id="stage">
    <div id="top">
      <button id="btn-wire">WIRE</button>
      <button id="btn-glow">GLOW</button>
      <button id="btn-spin" class="on">SPIN</button>
    </div>
    <div id="hud">loading…</div>
  </main>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PALETTE } from '/tools/asset-forge/src/runtime/palette.js';
import { registry, categories } from '/tools/asset-forge/src/registry.js';

const params = new URLSearchParams(location.search);
const capture = params.has('capture');
if (capture) document.body.classList.add('capture');

const stage = document.getElementById('stage');
const hud = document.getElementById('hud');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(capture ? window.innerWidth : (stage.clientWidth || 900), capture ? window.innerHeight : (stage.clientHeight || 900));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = !capture;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PALETTE.void);
scene.fog = null;

const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 400);

// One amber key, one cyan fill, one cool rim — the ART_DIRECTION.md lighting rule.
const key = new THREE.DirectionalLight(0xffd9a0, 3.1);
key.position.set(-4, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 60;
const fill = new THREE.DirectionalLight(0x54c8ff, 1.35);
fill.position.set(6, 3, 4);
const rim = new THREE.DirectionalLight(0xa9bccb, 1.6);
rim.position.set(2, 4, -7);
const ambient = new THREE.HemisphereLight(0x27384a, 0x05080c, 1.15);
scene.add(key, fill, rim, ambient);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

const stageGroup = new THREE.Group();
scene.add(stageGroup);

/**
 * Environment for the metal.
 *
 * A MeshStandardMaterial with metalness 0.7 and no environment reflects
 * nothing, which renders as black — that is a property of *this viewer*, not of
 * the model, and Godot supplies its own environment at runtime. So the viewer
 * builds a small procedural equirect gradient from the palette (void floor →
 * graphite horizon → cool zenith) and pre-filters it. No image is downloaded,
 * and every colour in it is a token.
 */
function buildEnvironment() {
  const width = 64;
  const height = 32;
  const data = new Uint8Array(width * height * 4);
  const stops = [
    [0.0, PALETTE.void],
    [0.42, PALETTE.panel3],
    [0.55, PALETTE.lineHi],
    [0.72, PALETTE.ink3],
    [1.0, PALETTE.ink2],
  ].map(([t, hex]) => [t, new THREE.Color(hex)]);
  for (let y = 0; y < height; y += 1) {
    const t = 1 - y / (height - 1); // 0 = bottom
    let a = stops[0];
    let b = stops[stops.length - 1];
    for (let i = 0; i < stops.length - 1; i += 1) {
      if (t >= stops[i][0] && t <= stops[i + 1][0]) { a = stops[i]; b = stops[i + 1]; break; }
    }
    const span = b[0] - a[0] || 1;
    const k = (t - a[0]) / span;
    const col = a[1].clone().lerp(b[1], k);
    for (let x = 0; x < width; x += 1) {
      const i = (y * width + x) * 4;
      data[i] = Math.round(col.r * 255);
      data[i + 1] = Math.round(col.g * 255);
      data[i + 2] = Math.round(col.b * 255);
      data[i + 3] = 255;
    }
  }
  const tex = new THREE.DataTexture(data, width, height, THREE.RGBAFormat);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = pmrem.fromEquirectangular(tex).texture;
  tex.dispose();
  pmrem.dispose();
  return env;
}

scene.environment = buildEnvironment();
scene.environmentIntensity = 1.15;

// Ground bounce card: off in capture mode so the silhouette stays measurable.
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(60, 48).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: new THREE.Color(PALETTE.panel), roughness: 0.94, metalness: 0.05 }),
);
ground.position.y = -0.001;
ground.receiveShadow = true;
ground.visible = !capture;
scene.add(ground);

let current = null;      // payload { id, root, sockets, clips, meta }
let mixer = null;
let spin = !params.has('nospin');
let showWire = false;
let showGlow = true;

function disposeStage() {
  mixer = null;
  for (const child of [...stageGroup.children]) {
    stageGroup.remove(child);
    child.traverse?.((o) => {
      if (o.isMesh) {
        o.geometry?.dispose?.();
      }
    });
  }
}

/**
 * Frame by measurement, not by formula.
 *
 * A bounding-sphere fit is wrong for anything with depth: the Runner is 0.6 m
 * wide and 1.5 m deep, so a sphere fit at 3 m put its tail outside the frame and
 * cropped the head. Instead, the eight bounding-box corners are projected and
 * the distance is searched until they all land inside the safe NDC box. This is
 * deterministic, works for a 12 m gate and a 0.4 m bolt, and cannot crop.
 */
function fitDistance(centre, box, azimuth, elevation, safe = 0.94) {
  const corners = [];
  for (const x of [box.min.x, box.max.x]) {
    for (const y of [box.min.y, box.max.y]) {
      for (const z of [box.min.z, box.max.z]) corners.push(new THREE.Vector3(x, y, z));
    }
  }
  const probe = camera.clone();
  probe.aspect = camera.aspect;
  probe.updateProjectionMatrix();
  const dir = new THREE.Vector3(
    Math.sin(azimuth) * Math.cos(elevation),
    Math.sin(elevation),
    Math.cos(azimuth) * Math.cos(elevation),
  );
  const fits = (dist) => {
    probe.position.copy(centre).addScaledVector(dir, dist);
    probe.lookAt(centre);
    probe.updateMatrixWorld(true);
    probe.updateProjectionMatrix();
    return corners.every((c) => {
      const v = c.clone().project(probe);
      return Math.abs(v.x) <= safe && Math.abs(v.y) <= safe && v.z < 1;
    });
  };
  const span = Math.max(box.max.x - box.min.x, box.max.y - box.min.y, box.max.z - box.min.z) || 1;
  let lo = span * 0.5;
  let hi = span * 40;
  if (!fits(hi)) return hi;
  for (let i = 0; i < 40; i += 1) {
    const mid = (lo + hi) / 2;
    if (fits(mid)) hi = mid; else lo = mid;
  }
  return hi;
}

function frameObject(root) {
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const centre = box.getCenter(new THREE.Vector3());
  const az = Number(params.get('az') ?? 34) * Math.PI / 180;
  const el = Number(params.get('el') ?? 12) * Math.PI / 180;
  const dist = fitDistance(centre, box, az, el);
  controls.target.copy(centre);
  camera.position.set(
    centre.x + Math.sin(az) * Math.cos(el) * dist,
    centre.y + Math.sin(el) * dist,
    centre.z + Math.cos(az) * Math.cos(el) * dist,
  );
  camera.near = Math.max(0.01, dist / 500);
  camera.far = dist * 40;
  camera.updateProjectionMatrix();
  camera.lookAt(centre);
  controls.update();
  return { size, centre, radius: size.length() * 0.5, dist };
}

function setWireframe(on) {
  stageGroup.traverse((o) => {
    if (o.isMesh && o.material && 'wireframe' in o.material) o.material.wireframe = on;
  });
}

export async function loadModel(id) {
  const entry = registry[id];
  if (!entry) throw new Error(`unknown model ${id}`);
  disposeStage();
  const mod = await entry.load();
  const payload = mod.build();
  stageGroup.add(payload.root);
  stageGroup.rotation.set(0, 0, 0);
  const framing = frameObject(payload.root);
  current = { ...payload, framing };
  if (payload.clips?.length) {
    mixer = new THREE.AnimationMixer(payload.root);
    const action = mixer.clipAction(payload.clips[0]);
    action.play();
    const t = params.get('t');
    if (t !== null) { mixer.setTime(Number(t)); }
  }
  setWireframe(showWire);
  document.querySelectorAll('button.item').forEach((b) => b.classList.toggle('active', b.dataset.id === id));
  hud.innerHTML = renderHud();
  window.__ready = true;
  window.__error = null;
  return payload;
}

function renderHud() {
  if (!current) return '';
  const m = current.meta;
  const clips = (current.clips ?? []).map((c) => c.name).join(', ') || '—';
  const sockets = Object.keys(current.sockets ?? {}).join(', ') || '—';
  return `<b>${m.name}</b> · ${m.category}<br>`
    + `source <b>${m.source}</b><br>`
    + `clips <b>${clips}</b><br>`
    + `sockets <b>${sockets}</b>`;
}

function buildList() {
  const list = document.getElementById('list');
  const byCat = categories();
  for (const [cat, ids] of Object.entries(byCat)) {
    const h = document.createElement('div');
    h.className = 'cat';
    h.textContent = `${cat} · ${ids.length}`;
    list.appendChild(h);
    for (const id of ids) {
      const b = document.createElement('button');
      b.className = 'item';
      b.dataset.id = id;
      b.textContent = registry[id].name ?? id;
      b.onclick = () => loadModel(id).catch((e) => { window.__error = String(e); hud.textContent = String(e); });
      list.appendChild(b);
    }
  }
}

/* ------------------------------------------------------------- capture API */

window.__debugProbe = async () => {
  const THREE = await import('three');
  const box = new THREE.Box3().setFromObject(current.root);
  const size = box.getSize(new THREE.Vector3());
  const centre = box.getCenter(new THREE.Vector3());
  const pts = [];
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) {
    const v = new THREE.Vector3(x, y, z).project(camera);
    pts.push([+v.x.toFixed(3), +v.y.toFixed(3)]);
  }
  return JSON.stringify({
    size: [size.x, size.y, size.z].map((v) => +v.toFixed(3)),
    centre: [centre.x, centre.y, centre.z].map((v) => +v.toFixed(3)),
    camPos: camera.position.toArray().map((v) => +v.toFixed(3)),
    target: controls.target.toArray().map((v) => +v.toFixed(3)),
    fov: camera.fov, aspect: +camera.aspect.toFixed(3),
    ndcMinY: Math.min(...pts.map((p) => p[1])), ndcMaxY: Math.max(...pts.map((p) => p[1])),
    ndcMinX: Math.min(...pts.map((p) => p[0])), ndcMaxX: Math.max(...pts.map((p) => p[0])),
    framing: { dist: +current.framing.dist.toFixed(3), radius: +current.framing.radius.toFixed(3) },
  }, null, 1);
};

window.__registryLookup = async (id) => (registry[id] ? registry[id].load() : null);

window.__api = {
  async list() { return Object.keys(registry); },
  async load(id) { await loadModel(id); return true; },
  /** Deterministic hashes of the built graph, computed inside the page. */
  async stats() {
    if (!current) throw new Error('no model loaded');
    const root = current.root;
    let tris = 0;
    let meshes = 0;
    let verts = 0;
    let hash = 2166136261 >>> 0;
    const materials = new Map();
    root.traverse((o) => {
      if (!o.isMesh) return;
      meshes += 1;
      const g = o.geometry;
      const pos = g.attributes.position;
      verts += pos.count;
      if (g.index) tris += g.index.count / 3;
      else tris += pos.count / 3;
      for (let i = 0; i < pos.count; i += 1) {
        const v = Math.round(pos.getX(i) * 1e4) + Math.round(pos.getY(i) * 1e4) * 31 + Math.round(pos.getZ(i) * 1e4) * 131;
        hash ^= v >>> 0;
        hash = Math.imul(hash, 16777619) >>> 0;
      }
      const list = Array.isArray(o.material) ? o.material : [o.material];
      for (const mat of list) {
        materials.set(mat.uuid, {
          type: mat.type,
          color: mat.color ? `#${mat.color.getHexString()}` : null,
          emissive: mat.emissive ? `#${mat.emissive.getHexString()}` : null,
          emissiveIntensity: mat.emissiveIntensity ?? null,
          transparent: !!mat.transparent,
          opacity: mat.opacity,
        });
      }
    });
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3());
    const centreVec = box.getCenter(new THREE.Vector3());
    const names = [];
    const sockets = [];
    root.traverse((o) => { if (o.name) names.push(o.name); if (o.isObject3D && o.userData?.socket) sockets.push(o.name); });
    // every socket recorded in finalize is an empty; collect them by identity
    const socketNames = Object.keys(current.sockets ?? {});
    const clipTracks = (current.clips ?? []).map((c) => ({
      name: c.name, duration: c.duration, tracks: c.tracks.map((t) => t.name), targets: c.userData?.targets ?? [],
    }));
    const nodeNameList = [];
    root.traverse((o) => { if (o.name) nodeNameList.push(o.name); });
    return {
      id: current.meta.id,
      triangles: Math.round(tris),
      vertices: verts,
      meshes,
      materials: [...materials.values()],
      materialCount: materials.size,
      size: { x: size.x, y: size.y, z: size.z },
      centre: { x: centreVec.x, y: centreVec.y, z: centreVec.z },
      minY: box.min.y,
      maxY: box.max.y,
      geometryHash: hash >>> 0,
      nodeCount: names.length,
      nodeNames: nodeNameList,
      duplicatedNames: names.filter((n, i) => names.indexOf(n) !== i),
      socketNames,
      forge: current.root.userData?.forge ?? null,
      clips: clipTracks,
    };
  },
  /** Render N views and return PNG data URLs; used by the gate, not by the UI. */
  async shots(views = [{ az: 0, el: 8 }, { az: 34, el: 12 }, { az: 90, el: 8 }], size = 720) {
    if (!current) throw new Error('no model loaded');
    const out = [];
    const prevSpin = spin;
    spin = false;
    for (const v of views) {
      setView(v.az, v.el);
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      renderer.render(scene, camera);
      out.push({ view: v, dataUrl: renderer.domElement.toDataURL('image/png') });
    }
    spin = prevSpin;
    // restore
    setView(Number(params.get('az') ?? 34), Number(params.get('el') ?? 12));
    return out;
  },
  async resize(size) {
    // updateStyle must be true: with it false the canvas keeps its old CSS box
    // and the screenshot captures a stretched/cropped view of the new buffer.
    renderer.setSize(size, size, true);
    camera.aspect = 1;
    camera.updateProjectionMatrix();
    if (current) current.framing = frameObject(current.root);
    return { width: size, height: size };
  },
  async glb() {
    if (!current) throw new Error('no model loaded');
    const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
    const exporter = new GLTFExporter();
    const root = current.root.clone(true);
    const binary = await new Promise((resolve, reject) => {
      exporter.parse(root, resolve, reject, {
      binary: true,
      onlyVisible: false,
      animations: current.clips ?? [],
    });
    });
    // base64 for transport
    let s = '';
    const bytes = new Uint8Array(binary);
    const chunk = 0x8000;
    for (let i = 0; i < bytes.length; i += chunk) {
      s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(s);
  },
  async setView(az, el) { setView(az, el); await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r))); return true; },
  async setTransform({ rx = 0, ry = 0, rz = 0 } = {}) {
    stageGroup.rotation.set(rx, ry, rz);
    return true;
  },
  async clips() { return (current?.clips ?? []).map((c) => c.name); },
  /**
   * Build the same model a second time from a cache-busted module URL and hash
   * the geometry again. Determinism is measured, not assumed: the gate compares
   * this hash with the one from the first build.
   */
  async rebuild(id, nonce) {
    const entry = registry[id];
    if (!entry) throw new Error(`unknown model ${id}`);
    const mod = await entry.load();
    const src = mod.meta.source;
    const url = new URL(`/tools/asset-forge/src/${categoryDir(mod.meta.category)}/${id}.js`, location.origin);
    url.searchParams.set('rebuild', String(nonce));
    const fresh = await import(url.href);
    const payload = fresh.build();
    let tris = 0;
    let hash = 2166136261 >>> 0;
    payload.root.traverse((o) => {
      if (!o.isMesh) return;
      const pos = o.geometry.attributes.position;
      if (o.geometry.index) tris += o.geometry.index.count / 3;
      else tris += pos.count / 3;
      for (let i = 0; i < pos.count; i += 1) {
        const v = Math.round(pos.getX(i) * 1e4) + Math.round(pos.getY(i) * 1e4) * 31 + Math.round(pos.getZ(i) * 1e4) * 131;
        hash ^= v >>> 0;
        hash = Math.imul(hash, 16777619) >>> 0;
      }
    });
    return { geometryHash: hash >>> 0, triangles: Math.round(tris), source: src };
  },
  async playClip(name, time = 0.4) {
    if (!mixer || !current) return false;
    const found = current.clips.find((c) => c.name === name);
    if (!found) return false;
    mixer.stopAllAction();
    const action = mixer.clipAction(found);
    action.reset().play();
    mixer.setTime(time);
    return true;
  },
};

function categoryDir(category) {
  return { world: 'world', hero: 'heroes', weapon: 'weapons', enemy: 'enemies', vfx: 'vfx' }[category] ?? category;
}

function setView(azDeg, elDeg) {
  if (!current) return;
  const az = azDeg * Math.PI / 180;
  const el = elDeg * Math.PI / 180;
  const box = new THREE.Box3().setFromObject(current.root);
  const centre = box.getCenter(new THREE.Vector3());
  const dist = fitDistance(centre, box, az, el);
  camera.position.set(
    centre.x + Math.sin(az) * Math.cos(el) * dist,
    centre.y + Math.sin(el) * dist,
    centre.z + Math.cos(az) * Math.cos(el) * dist,
  );
  camera.near = Math.max(0.01, dist / 500);
  camera.far = dist * 40;
  camera.updateProjectionMatrix();
  camera.lookAt(centre);
  controls.target.copy(centre);
  controls.update();
  current.framing = { ...current.framing, centre, dist };
}

/* ------------------------------------------------------------------ loop */

function resize() {
  const w = capture ? window.innerWidth : stage.clientWidth;
  const h = capture ? window.innerHeight : stage.clientHeight;
  renderer.setSize(w, h, true);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

document.getElementById('btn-wire').onclick = (e) => {
  showWire = !showWire; setWireframe(showWire); e.currentTarget.classList.toggle('on', showWire);
};
document.getElementById('btn-spin').onclick = (e) => {
  spin = !spin; e.currentTarget.classList.toggle('on', spin);
};
document.getElementById('btn-glow').onclick = (e) => {
  showGlow = !showGlow;
  e.currentTarget.classList.toggle('on', showGlow);
  stageGroup.traverse((o) => {
    if (o.isMesh && o.material) {
      const list = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of list) if (m.emissiveIntensity !== undefined) {
        if (!m.userData.__baseGlow && m.emissiveIntensity > 0) m.userData.__baseGlow = m.emissiveIntensity;
        m.emissiveIntensity = showGlow ? (m.userData.__baseGlow ?? 0) : 0;
      }
    }
  });
};
document.getElementById('btn-glow').classList.add('on');

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);
  if (spin && !capture) stageGroup.rotation.y += dt * 0.32;
  controls.update();
  renderer.render(scene, camera);
}

buildList();
resize();
animate();

const initial = params.get('model');
if (initial) {
  loadModel(initial).catch((e) => { window.__error = String(e); hud.textContent = String(e); });
} else {
  const first = Object.keys(registry)[0];
  if (first) {
    loadModel(first).catch((e) => { window.__error = String(e); hud.textContent = String(e); });
  } else {
    hud.textContent = 'no models registered yet';
    window.__ready = true;
  }
}
</script>
</body>
</html>
