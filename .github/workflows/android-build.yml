name: Android debug APK

# The device half of the two-path rule in docs/ARCHITECTURE.md §4: the web
# preview proves a change builds and runs, the APK is what goes on a phone for
# real visual and frame-rate testing. The web pipeline already exists in
# godot-ci.yml; this job is the one that was missing.
#
# It is deliberately its own workflow. On `push` it runs when the repository
# sets ANDROID_BUILD_ENABLED=true or the head commit opts in with the literal
# tag [android-build]. The tag works on Arena branches without changing repo
# settings. An Android export needs JDK 17, an SDK and export templates; if any
# of those move, a red Android job does not stop the separate Web workflow.
# Manual runs (`workflow_dispatch`) always run when the caller has that access.

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK (arm64)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.ANDROID_BUILD_ENABLED == 'true' ||
      contains(github.event.head_commit.message, '[android-build]')
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install runtime libraries for Godot
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libxi6 libxcursor1 libxinerama1 libxrandr2 libxkbcommon0 \
            unzip curl

      - name: Install the pinned Godot editor with export templates
        run: ./scripts/install_godot.sh --with-templates

      - name: Report engine version
        run: godot --version

      - name: Install the Android command-line tools
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          # Pinned command-line-tools build. Google keeps the -latest alias
          # moving; if this 404s, bump the number from
          # https://developer.android.com/studio#command-line-tools-only
          curl -sSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          # --install-packages accepts the licences itself (yes | sdkmanager
          # --licenses) and installs platform-tools, platforms;android-36 and
          # build-tools;36.0.0 by default.
          ./scripts/setup_android_sdk.sh --install-packages

      - name: Scaffold the Android export preset
        run: |
          # export_presets.cfg is git-ignored and machine-local, so it is
          # generated here rather than committed.
          python3 tools/android_preset.py scaffold \
            --preset-file game/export_presets.cfg --preset-name Android --force
          python3 tools/android_preset.py check

      - name: Export the debug APK
        # The export script runs the whole headless smoke suite first and
        # refuses to package a build that fails it.
        run: ./scripts/export_android_debug.sh

      - name: Check what actually shipped inside the APK
        run: |
          ls -lh exports/exocomplict-debug.apk
          python3 tools/check_payload.py exports/exocomplict-debug.apk
          python3 - <<'PY'
          from tools.check_payload import parse_pck

          entries, _, _ = parse_pck("exports/exocomplict-debug.apk")
          paths = {path for path, _, _ in entries}
          profiler = "scripts/integration/device_profiler"
          if not any(path in paths for path in (profiler + ".gd", profiler + ".gdc")):
              raise SystemExit("Android APK does not contain the device profiler implementation")
          print("ok: Android APK contains the opt-in device profiler implementation")
          PY

      - name: Report the build
        run: |
          {
            echo "### Android debug APK"
            echo ""
            echo "- preset: Android (arm64-v8a, no Gradle build)"
            echo "- size: $(du -h exports/exocomplict-debug.apk | cut -f1)"
            echo "- payload checked: forbidden content absent; device profiler implementation present"
            echo ""
            echo "Packaging only. Install it and measure before making any"
            echo "device, frame-rate or thermal claim (docs/runbooks/ANDROID.md)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: exports/exocomplict-debug.apk
          if-no-files-found: error
          retention-days: 14
