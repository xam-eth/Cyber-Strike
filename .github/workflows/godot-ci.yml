name: Godot CI

# Static checks run everywhere. The engine job installs the pinned Godot
# 4.7.2-stable editor and runs the headless smoke tests, which is the only way
# to verify gameplay behaviour without a local Godot install.

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:
    inputs:
      bake_hero:
        description: "Run Blender inspection/clip authoring and publish .blend + verified GLB on this branch"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  static:
    name: Static checks (gdtoolkit + project doctor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install -r requirements-dev.txt

      - name: Run static development check
        run: ./scripts/dev_check.sh

  engine:
    name: Headless smoke tests (Godot 4.7.2)
    runs-on: ubuntu-latest
    # Backstop: the runner already times out each test, this bounds the whole job.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime libraries for Godot
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libxi6 libxcursor1 libxinerama1 libxrandr2 libxkbcommon0 || \
            echo "Some optional libraries were unavailable; continuing."

      - name: Install pinned Godot editor
        run: |
          ./scripts/install_godot.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report engine version
        run: godot --version

      - name: Run headless smoke tests
        env:
          # A test that hangs is a failed test; cap it short enough that one
          # regression cannot consume the job budget.
          SMOKE_TEST_TIMEOUT: 60
        run: ./scripts/run_smoke_tests.sh

      - name: Publish verification evidence
        if: always()
        run: |
          summary="exports/test-logs/summary.txt"
          if [[ -f "$summary" ]]; then
            {
              echo '## Smoke test evidence'
              echo '```'
              cat "$summary"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No summary file was produced; the run failed before reporting.' >> "$GITHUB_STEP_SUMMARY"
          fi
          for log in exports/test-logs/*.log; do
            [[ -e "$log" ]] || continue
            {
              echo "### $(basename "$log")"
              echo '```'
              tail -n 15 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: exports/test-logs
          if-no-files-found: ignore

  web-preview:
    name: Web preview build (WebAssembly)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # contents: write is only used by the "commit the payload" step below, and
    # that step runs on push events to this repository only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime libraries for Godot
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libxi6 libxcursor1 libxinerama1 libxrandr2 libxkbcommon0 || \
            echo "Some optional libraries were unavailable; continuing."

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-export-templates-${{ hashFiles('.godot-version') }}

      - name: Install pinned Godot editor with export templates
        run: |
          ./scripts/install_godot.sh --with-templates
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report engine version
        run: godot --version

      - name: Report available export templates
        run: |
          templates_root="${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates"
          echo "templates root: $templates_root"
          if [[ -d "$templates_root" ]]; then
            find "$templates_root" -maxdepth 2 -type f -name '*.zip' -printf '%P\n' | sort | head -40
            web_count="$(find "$templates_root" -type f -name 'web*.zip' | wc -l | tr -d ' ')"
            echo "::notice title=Web export templates::installed web template archives: $web_count"
          else
            echo "::error title=Export templates missing::no templates directory at $templates_root"
            exit 1
          fi

      - name: Export the Web preview build
        run: |
          mkdir -p exports
          set +e
          ./scripts/export_web_preview.sh --output web 2>&1 | tee exports/web-preview-run.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            # Surface the tail of the Godot logs as annotations: the full job log
            # is not always retrievable through the API, annotations are.
            digest=""
            for log_file in exports/web-preview-run.log exports/web-export.log exports/web-import.log; do
              [[ -f "$log_file" ]] || continue
              errors="$(grep -iE 'error|fail|missing|cannot|unable|refuse' "$log_file" | tail -n 6 | tr '\n' '|')"
              [[ -z "$errors" ]] && errors="$(tail -n 4 "$log_file" | tr '\n' '|')"
              digest="${digest}$(basename "$log_file"): ${errors:-<no error lines>} || "
            done
            digest="$(printf '%s' "$digest" | cut -c1-1400)"
            echo "::error title=Web export failed (exit $status)::${digest:-no log files produced}"
            exit $status
          fi

      - name: Verify static-server delivery
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 --directory web >/dev/null 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          report=""
          for asset in index.html index.js index.wasm index.pck; do
            line="$(curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}B' "http://127.0.0.1:8123/$asset")"
            echo "$asset -> $line"
            report="${report}${asset}: ${line} | "
          done
          echo "::notice title=Static delivery (python -m http.server)::${report}"
          wasm_status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/index.wasm)"
          pck_status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/index.pck)"
          if [[ "$wasm_status" != "200" || "$pck_status" != "200" ]]; then
            echo "Static server did not deliver the engine payload (wasm=$wasm_status pck=$pck_status)" >&2
            exit 1
          fi

      - name: Package the preview artifact
        run: |
          mkdir -p exports/web-preview
          cp -R web exports/web-preview/web
          python3 -c 'import pathlib; pathlib.Path("exports/web-preview/README.txt").write_text(
            "Project Overdrive — WebAssembly preview build\n"
            "=============================================\n\n"
            "How to run:\n"
            "  1. Extract this archive into the repository root so that the folder 'web/' appears.\n"
            "  2. From the repository root run:  python -m http.server 800 --bind 0.0.0.0\n"
            "  3. Open http://localhost:800/  (landing page) or http://localhost:800/web/ (raw build).\n\n"
            "Details, controls, and limitations: WEB_PREVIEW.md\n")'
          du -sh exports/web-preview/web
          find exports/web-preview -maxdepth 2 -type f | sort

      - name: Upload the web preview
        uses: actions/upload-artifact@v4
        with:
          name: web-preview
          path: exports/web-preview
          if-no-files-found: error
          retention-days: 14

      - name: Browser smoke test of the exported build
        run: |
          # Real Chromium from the pinned packages: proves the engine boots with
          # WebGL 2 and that index.wasm/index.pck resolve from both entry pages.
          npm ci --prefix tools --no-audit --no-fund
          # Do not let set -e discard the report when a browser check fails.
          # Per-page error annotations stay readable even when Actions log
          # downloads are unavailable and the whole workflow is still running.
          qa_status=0
          node tools/web_qa.mjs --json > exports/web-qa-report.json || qa_status=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          report_path = Path("exports/web-qa-report.json")
          if not report_path.exists() or not report_path.stat().st_size:
              print("::error title=Web QA report missing::Chromium quit before writing a JSON report")
              raise SystemExit(1)
          report = json.loads(report_path.read_text())
          for page in report["pages"]:
              print(f'{page["target"]}: {"PASS" if not page["failed"] else "FAIL"} | engine: {page["engine"]} | canvas: {page["state"]["canvasSize"]}')
              if page["failed"]:
                  details = [str(item) for item in page["failed"]]
                  details += [str(item) for item in page.get("scriptErrors", [])]
                  details += [str(item) for item in page.get("pageErrors", [])]
                  if page["state"].get("failureText"):
                      details.append(page["state"]["failureText"])
                  print("::error title=Web QA " + page["target"] + "::" + " | ".join(details).replace("\n", " ")[:2000])
          print("::notice title=Web QA (Chromium)" + "::" + " | ".join(
              f'{p["target"]} {"PASS" if not p["failed"] else "FAIL"} ({p["state"]["canvasSize"]}, {p["engine"] or "no engine"})'
              for p in report["pages"]))
          raise SystemExit(0 if report["ok"] else 1)
          PY
          exit "$qa_status"

      - name: Upload the web QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-qa
          path: exports/web-qa
          if-no-files-found: warn
          retention-days: 14

      - name: Stage the web export templates for offline builds
        run: |
          # Mirror the Scary-Night layout: keep the *web* export templates in the
          # repository so a local export needs no 1.2 GB template download.
          templates_root="${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates"
          version_dir="$(find "$templates_root" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort | tail -n 1)"
          echo "templates directory: ${version_dir:-<none>}"
          mkdir -p engine/web_templates
          staged=0
          for name in web_nothreads_release.zip web_nothreads_debug.zip web_release.zip web_debug.zip; do
            if [[ -n "$version_dir" && -f "$version_dir/$name" ]]; then
              cp "$version_dir/$name" "engine/web_templates/$name"
              staged=$((staged + 1))
            fi
          done
          echo "staged $staged template archive(s)"
          ls -lh engine/web_templates || true
          echo "::notice title=Web export templates staged::${staged} archive(s) in engine/web_templates"

      - name: Commit the payload and templates into the repository
        # Pushes only: PR runs from forks get a read-only token. The commit is
        # what makes "git pull + python -m http.server 800" play the game.
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in web engine/web_templates; do
            [[ -e "$path" ]] && git add "$path"
          done
          if git diff --cached --quiet; then
            echo "Payload and templates are unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Refresh the committed web payload and templates [skip ci]" \
            -m "Exported by the web-preview job of run ${GITHUB_RUN_ID} from ${GITHUB_SHA:0:7}." \
            -m "Generated output only; no source changes belong here."
          # The job log is not always retrievable through the API, so whatever
          # decides this step is echoed as an annotation as well.
          state() { git status --short | tr '\n' '|'; }
          echo "::notice title=Payload commit::worktree=$(state)"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            # Parallel CI runs must not replace a newer source build with a
            # stale PCK. Only bot-generated payload commits may be rebased over.
            if [[ -n "$(git log --format=%H "${GITHUB_SHA}..origin/${GITHUB_REF_NAME}" \
              -- . ':(exclude)web' ':(exclude)engine/web_templates' | head -n 1)" ]]; then
              echo "::notice title=Stale preview skipped::A newer source commit needs its own Web export"
              exit 0
            fi
            # autoStash: the export leaves machine-local files behind in the
            # worktree, and rebase refuses to start on a dirty tree.
            # -X theirs: the only files that can conflict here are the binary
            # payload and the templates, and this run's fresh export is the
            # newer truth for both.
            if git -c rebase.autoStash=true rebase -X theirs "origin/${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "::warning title=Payload push retry ${attempt}::$(state)"
            git rebase --abort 2>/dev/null || true
            sleep 4
          done
          echo "::error title=Preview push failed::$(state)"
          exit 1

      - name: Publish web preview summary
        if: always()
        run: |
          {
            echo '## Web preview (WebAssembly)'
            echo 'Download the `web-preview` artifact, extract it into the repository root, then run:'
            echo '```bash'
            echo 'python -m http.server 800 --bind 0.0.0.0'
            echo '```'
            echo 'Open `http://localhost:800/`. See `WEB_PREVIEW.md` for details and limitations.'
            if [[ -f exports/web-preview/web/index.pck ]]; then
              echo
              echo 'Build payload:'
              echo '```'
              ls -lh exports/web-preview/web | sed 's/^/  /'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -f exports/web-preview/web/index.pck ]]; then
            total="$(du -sh exports/web-preview/web | cut -f1)"
            echo "::notice title=Web preview artifact::web/ totals ${total}; artifact 'web-preview' is ready to download"
          fi

  deploy-pages:
    name: Publish web preview to GitHub Pages
    # Manual dispatch (any branch) or automatic after a push to main.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: web-preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download the web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-preview
          path: artifacts

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -R artifacts/web site/web
          cp index.html site/index.html
          # The landing page loads ./web/index.html, which is valid on Pages too.
          grep -q "web/index.html" site/index.html
          touch site/.nojekyll   # serve files verbatim, skip Jekyll
          echo "site contents:"
          find site -maxdepth 2 -type f -printf '%P %s bytes\n' | sort
          du -sh site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish the preview URL
        if: always()
        run: |
          {
            echo '## Web preview URL'
            echo
            echo "Pages deployment: \`${{ steps.deployment.outputs.page_url }}\`"
            echo
            echo 'Open that URL in a browser to play the WebAssembly build; no download or local server needed.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Web preview URL::${{ steps.deployment.outputs.page_url }}"

  lfs-assets:
    name: Inspect the LFS asset archive
    # Dispatch-only in spirit: GitHub will not run workflow_dispatch for a
    # workflow that only exists on a side branch, so the trigger is a marker in
    # the commit message. The 259 MB pack is an LFS pointer the development
    # sandbox cannot resolve; a runner can, and this job writes down what is
    # actually inside it.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[lfs-inspect]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify the archive resolved
        run: |
          ls -lh 3DScifiStarterKitFree.zip
          size=$(stat -c%s 3DScifiStarterKitFree.zip)
          echo "size=$size"
          if [ "$size" -lt 100000000 ]; then
            echo "::error title=LFS object not fetched::the zip is $size bytes, which is still the pointer"
            exit 1
          fi
          sha256sum 3DScifiStarterKitFree.zip

      - name: Write the manifest
        run: |
          mkdir -p docs
          out=docs/LFS_ASSET_MANIFEST.md
          {
            echo "# Manifest of \`3DScifiStarterKitFree.zip\`"
            echo
            echo "Generated on a GitHub runner from the LFS object, $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo "Archive size: $(stat -c%s 3DScifiStarterKitFree.zip) bytes."
            echo
            echo "## By extension"
            echo
            echo '| Extension | Files | Uncompressed bytes |'
            echo '|---|---:|---:|'
            unzip -l 3DScifiStarterKitFree.zip \
              | awk 'NR>3 && NF>=4 {n=$4; for(i=5;i<=NF;i++) n=n" "$i;
                     if (n ~ /\/$/) next;
                     ext="(none)"; if (match(n, /\.[^.\/]+$/)) ext=tolower(substr(n, RSTART+1));
                     count[ext]++; bytes[ext]+=$1}
                     END {for (e in count) printf "%s\t%d\t%d\n", e, count[e], bytes[e]}' \
              | sort -t$'\t' -k2,2nr \
              | while IFS=$'\t' read -r ext n b; do echo "| \`$ext\` | $n | $b |"; done
            echo
            echo "## Directories"
            echo
            echo '| Top-level path | Files |'
            echo '|---|---:|'
            unzip -l 3DScifiStarterKitFree.zip \
              | awk 'NR>3 && NF>=4 {n=$4; for(i=5;i<=NF;i++) n=n" "$i;
                     if (n ~ /\/$/) next;
                     split(n, parts, "/"); if (length(parts) == 1) top="(root)"; else top=parts[1];
                     count[top]++}
                     END {for (d in count) printf "%s\t%d\n", d, count[d]}' \
              | sort -t$'\t' -k2,2nr \
              | while IFS=$'\t' read -r d n; do echo "| \`$d\` | $n |"; done
            echo
            echo "## Every model file"
            echo
            echo '| Model | Compressed bytes |'
            echo '|---|---:|'
            unzip -l 3DScifiStarterKitFree.zip \
              | awk 'NR>3 && NF>=4 {n=$4; for(i=5;i<=NF;i++) n=n" "$i;
                     if (tolower(n) ~ /\.(fbx|obj|glb|gltf|blend|max)$/) printf "%s\t%d\n", n, $1}' \
              | sort \
              | while IFS=$'\t' read -r f b; do echo "| \`$f\` | $b |"; done
            echo
            echo "## Every texture"
            echo
            echo '| Texture | Compressed bytes |'
            echo '|---|---:|'
            unzip -l 3DScifiStarterKitFree.zip \
              | awk 'NR>3 && NF>=4 {n=$4; for(i=5;i<=NF;i++) n=n" "$i;
                     if (n ~ /\.(png|jpg|jpeg|tga|tif|tiff|exr|hdr)$/) printf "%s\t%d\n", n, $1}' \
              | sort \
              | while IFS=$'\t' read -r f b; do echo "| \`$f\` | $b |"; done
          } > "$out"
          wc -l "$out"
          head -60 "$out"

      - name: Commit the manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LFS_ASSET_MANIFEST.md
          if git diff --cached --quiet; then
            echo "Manifest unchanged."
            exit 0
          fi
          git commit -m "Add the LFS archive manifest [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  lfs-convert:
    name: Convert the LFS FBX pack to GLB
    # The 259 MB pack is an LFS pointer. Neither the sandbox this branch is
    # developed in nor `gh run download` can reach the LFS/artifact hosts, so
    # the only channel back is git itself. This job resolves the archive on the
    # runner, converts the FBX models to self-contained GLB with 512 px
    # textures packed in, and commits the result. Triggered by the marker
    # because GitHub refuses workflow_dispatch for workflows that only exist on
    # a side branch.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[lfs-pack]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Install Blender
        run: |
          # The apt build on ubuntu-latest ships without numpy, which the FBX
          # importer needs, so the blender.org tarball is the reliable path.
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy
          if ! blender --background --factory-startup --python-expr "import numpy" >/tmp/blender-check.log 2>&1; then
            echo "apt Blender cannot import numpy; using the official tarball"
            curl -fsSL https://download.blender.org/release/Blender4.2/ \
              | grep -o 'blender-4\.2\.[0-9]*-linux-x64\.tar\.xz' | sort -u | tail -1 > /tmp/blender-name.txt
            name=$(cat /tmp/blender-name.txt)
            echo "downloading $name"
            curl -fsSL -o /tmp/blender.tar.xz "https://download.blender.org/release/Blender4.2/$name"
            tar -xf /tmp/blender.tar.xz -C /tmp
            echo "BLENDER_BIN=$(find /tmp -maxdepth 2 -name blender -type f | head -1)" >> "$GITHUB_ENV"
          else
            echo "BLENDER_BIN=blender" >> "$GITHUB_ENV"
          fi
          "$BLENDER_BIN" --version | head -3

      - name: Unpack the archive
        run: |
          size=$(stat -c%s 3DScifiStarterKitFree.zip)
          echo "zip is $size bytes"
          test "$size" -gt 100000000
          mkdir -p /tmp/pack
          unzip -q 3DScifiStarterKitFree.zip -d /tmp/pack
          find /tmp/pack -type f -iname '*.fbx' | wc -l
          find /tmp/pack -type d | head -20

      - name: Convert FBX to GLB
        run: |
          mkdir -p game/assets/world/scifi_starter_kit/models
          "$BLENDER_BIN" --background --factory-startup --python tools/convert_fbx_pack.py -- \
            /tmp/pack game/assets/world/scifi_starter_kit/models \
            --texture-size 512 2>&1 | tail -40
          ls -la game/assets/world/scifi_starter_kit/models | head
          du -sh game/assets/world/scifi_starter_kit/models
          count=$(find game/assets/world/scifi_starter_kit/models -name '*.glb' | wc -l)
          echo "converted $count models"
          if [ "$count" -lt 1 ]; then
            echo "::error title=Conversion produced nothing::see the Blender log above"
            exit 1
          fi

      - name: Write the manifest
        run: |
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path("game/assets/world/scifi_starter_kit/models")
          files = sorted(p.name for p in root.glob("*.glb"))
          data = {
              "source": "3DScifiStarterKitFree.zip",
              "generator": "tools/convert_fbx_pack.py (Blender glTF exporter)",
              "texture_size": 512,
              "models": files,
          }
          (root.parent / "manifest.json").write_text(json.dumps(data, indent=2) + "\n")
          print(len(files), "models")
          PY

      - name: Commit the converted models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/assets/world/scifi_starter_kit
          if git diff --cached --quiet; then
            echo "Nothing converted."
            exit 0
          fi
          git commit -m "Convert the uploaded FBX pack to GLB [skip ci]" \
            -m "Blender conversion on a runner that can fetch the LFS object; textures are packed at 512 px."
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

  hero-blender:
    name: Inspect and author hero in Blender
    # workflow_dispatch does not trigger from an unmerged branch on GitHub.
    # Explicit marker on our fixed branch runs this expensive authoring pass.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/arena/5257bce8-cyber-strike' &&
      contains(github.event.head_commit.message, '[hero-blender]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Blender and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy
          blender --background --factory-startup --python-expr 'import bpy, numpy; print(bpy.app.version_string)'

      - name: Inspect real GLBs and author motion clips
        run: |
          mkdir -p exports
          set +e
          # Blender otherwise returns 0 even if the Python script raises.
          blender --background --factory-startup --python-exit-code 1 \
            --python tools/blender/author_hero.py > exports/blender-hero.log 2>&1
          status=$?
          set -e
          tail -n 35 exports/blender-hero.log
          if [[ "$status" -ne 0 ]]; then
            digest="$( (grep -E 'Traceback|RuntimeError|Error:|ValueError|AttributeError' exports/blender-hero.log || true) | tail -n 4 | tr '\n' '|' )"
            if [[ -z "$digest" ]]; then
              digest="$(tail -n 8 exports/blender-hero.log | tr '\n' '|' )"
            fi
            echo "::error title=Blender hero failed::${digest:-check logs}"
            exit "$status"
          fi
          for required in source-assets/characters/hero/hero_source.blend docs/asset-inspections/hero-blender.json; do
            if [[ ! -s "$required" ]]; then
              echo "::error title=Blender output missing::$required was not generated"
              exit 1
            fi
          done

      - name: Verify exported hero in Godot before publication
        run: |
          ./scripts/install_godot.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          set +e
          GODOT_BIN="$HOME/.local/bin/godot" SMOKE_TEST_TIMEOUT=60 \
            ./scripts/run_smoke_tests.sh hero_rig_smoke combat_feedback_smoke effects_smoke
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            for log in exports/test-logs/import.log exports/test-logs/hero_rig_smoke.log; do
              [[ -f "$log" ]] || continue
              digest="$( (grep -iE 'hero.glb|missing|ERROR:|Parse Error|failed:' "$log" || true) | head -n 7 | tr '\n' '|')"
              echo "::error title=Blender hero Godot validation::$(basename "$log"): ${digest:-no diagnostic lines}"
            done
            exit "$status"
          fi

      - name: Publish Blender source and tested GLB on the fixed branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-assets/characters/hero/hero_source.blend \
            game/assets/characters/hero/hero.glb docs/asset-inspections/hero-blender.json
          git diff --cached --check
          git commit -m 'Build and inspect hero motion in Blender' \
            -m 'Includes the .blend source and exported clips. Headless Godot smoke checks ran; human motion review remains open.'
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
