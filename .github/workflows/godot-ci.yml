name: Godot CI

# Static checks run everywhere. The engine job installs the pinned Godot
# 4.7.2-stable editor and runs the headless smoke tests, which is the only way
# to verify gameplay behaviour without a local Godot install.

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:
    inputs:
      bake_hero:
        description: "Run Blender inspection/clip authoring and publish .blend + verified GLB on this branch"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  static:
    name: Static checks (gdtoolkit + project doctor)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install -r requirements-dev.txt

      - name: Run static development check
        run: ./scripts/dev_check.sh

  engine:
    name: Headless smoke tests (Godot 4.7.2)
    runs-on: ubuntu-24.04
    # Backstop: the runner already times out each test, this bounds the whole job.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime libraries for Godot
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libxi6 libxcursor1 libxinerama1 libxrandr2 libxkbcommon0 || \
            echo "Some optional libraries were unavailable; continuing."

      - name: Install pinned Godot editor
        run: |
          ./scripts/install_godot.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report engine version
        run: godot --version

      - name: Run headless smoke tests
        env:
          # A test that hangs is a failed test; cap it short enough that one
          # regression cannot consume the job budget.
          SMOKE_TEST_TIMEOUT: 60
        run: ./scripts/run_smoke_tests.sh

      - name: Publish verification evidence
        if: always()
        run: |
          summary="exports/test-logs/summary.txt"
          if [[ -f "$summary" ]]; then
            {
              echo '## Smoke test evidence'
              echo '```'
              cat "$summary"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No summary file was produced; the run failed before reporting.' >> "$GITHUB_STEP_SUMMARY"
          fi
          for log in exports/test-logs/*.log; do
            [[ -e "$log" ]] || continue
            {
              echo "### $(basename "$log")"
              echo '```'
              tail -n 15 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          # Engine stdout is captured per test, so a green job alone must not be
          # mistaken for route evidence. Surface the measured positions through
          # the annotations API when full log/artifact downloads are unavailable.
          python3 - <<'PY'
          from pathlib import Path
          log = Path('exports/test-logs/mission_world_smoke.log')
          if log.exists():
              prefix = 'STELLAR HORIZON PROBE '
              probes = [line[len(prefix):].strip() for line in log.read_text(errors='replace').splitlines()
                        if line.startswith(prefix)]
              if probes:
                  detail = ' | '.join(probes).replace('\r', ' ')[:1800]
                  print(f'::notice title=STELLAR HORIZON deployment and surface probe::{detail}')
          PY

      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: exports/test-logs
          if-no-files-found: ignore

  web-preview:
    name: Web preview build (WebAssembly)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # contents: write is only used by the "commit the payload" step below, and
    # that step runs on push events to this repository only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime libraries for Godot
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libxi6 libxcursor1 libxinerama1 libxrandr2 libxkbcommon0 || \
            echo "Some optional libraries were unavailable; continuing."

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-export-templates-${{ hashFiles('.godot-version') }}

      - name: Install pinned Godot editor with export templates
        run: |
          ./scripts/install_godot.sh --with-templates
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report engine version
        run: godot --version

      - name: Report available export templates
        run: |
          templates_root="${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates"
          echo "templates root: $templates_root"
          if [[ -d "$templates_root" ]]; then
            find "$templates_root" -maxdepth 2 -type f -name '*.zip' -printf '%P\n' | sort | head -40
            web_count="$(find "$templates_root" -type f -name 'web*.zip' | wc -l | tr -d ' ')"
            echo "::notice title=Web export templates::installed web template archives: $web_count"
          else
            echo "::error title=Export templates missing::no templates directory at $templates_root"
            exit 1
          fi

      - name: Export the Web preview build
        run: |
          mkdir -p exports
          set +e
          ./scripts/export_web_preview.sh --output web 2>&1 | tee exports/web-preview-run.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            # Surface the tail of the Godot logs as annotations: the full job log
            # is not always retrievable through the API, annotations are.
            digest=""
            for log_file in exports/web-preview-run.log exports/web-export.log exports/web-import.log; do
              [[ -f "$log_file" ]] || continue
              errors="$(grep -iE 'error|fail|missing|cannot|unable|refuse' "$log_file" | tail -n 6 | tr '\n' '|')"
              [[ -z "$errors" ]] && errors="$(tail -n 4 "$log_file" | tr '\n' '|')"
              digest="${digest}$(basename "$log_file"): ${errors:-<no error lines>} || "
            done
            digest="$(printf '%s' "$digest" | cut -c1-1400)"
            echo "::error title=Web export failed (exit $status)::${digest:-no log files produced}"
            exit $status
          fi

      - name: Audit the exported content payload
        run: |
          python3 tools/check_payload.py web/index.pck --json > exports/web-payload-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.check_payload import parse_pck
          entries, _, _ = parse_pck('web/index.pck')
          paths = [entry[0] for entry in entries]
          required = {
              'frostline': 'assets/forge/worlds/frostline.glb',
              'verdant': 'assets/forge/worlds/verdant.glb',
              'emberfall': 'assets/forge/worlds/emberfall.glb',
              'vanguard_station': 'scenes/worlds/vanguard_station.tscn',
              'titans': 'assets/forge/worlds/titans.glb',
              # These are dynamic ContentModuleLoader paths now. Their presence
              # must be measured in the pack, not inferred from scene imports.
              'hero': 'assets/characters/hero/hero.glb',
              'held_weapon': 'assets/weapons/futuristic_rifle/rifle.glb',
              'runner': 'assets/world/kenney_space_kit/alien.glb',
              'shooter': 'assets/world/kenney_space_kit/astronauta.glb',
              'guardian': 'assets/enemies/enemy_iron_warden_boss.glb',
              'training_drone': 'assets/world/kenney_space_kit/craft-miner.glb',
              'recovery_cache': 'assets/world/kenney_space_kit/station-computer-wide.glb',
          }
          missing = [name for name, resource in required.items()
                     if not any(resource in path for path in paths)]
          if missing:
              raise SystemExit(f'Exported PCK is missing content resources: {missing}')
          size = Path('web/index.pck').stat().st_size
          if size >= 100000000:
              raise SystemExit(f'Exported PCK exceeds the 100000000-byte plain-clone budget: {size}')
          largest = sorted(entries, key=lambda entry: entry[2], reverse=True)[:5]
          detail = ', '.join(f'{path}={size}' for path, _, size in largest)
          print(f'::notice title=Exported content payload::PCK {size} bytes, {len(entries)} files; all five worlds and dynamic Character/Recovery visuals present; largest: {detail}')
          Path('exports/web-payload-summary.json').write_text(json.dumps({
              'pck_bytes': size,
              'files': len(entries),
              'worlds': ['frostline_relay', 'verdant_bloom', 'emberfall_foundry', 'vanguard_station', 'titans'],
              'dynamic_character_visuals': ['hero', 'held_weapon', 'runner', 'shooter', 'guardian', 'training_drone'],
              'dynamic_world_visuals': ['recovery_cache'],
              'largest': [{'path': path, 'bytes': size} for path, _, size in largest],
          }, indent=2) + '\n')
          PY

      - name: Verify static-server delivery
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 --directory web >/dev/null 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          report=""
          for asset in index.html index.js index.wasm index.pck; do
            line="$(curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}B' "http://127.0.0.1:8123/$asset")"
            echo "$asset -> $line"
            report="${report}${asset}: ${line} | "
          done
          echo "::notice title=Static delivery (python -m http.server)::${report}"
          wasm_status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/index.wasm)"
          pck_status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/index.pck)"
          if [[ "$wasm_status" != "200" || "$pck_status" != "200" ]]; then
            echo "Static server did not deliver the engine payload (wasm=$wasm_status pck=$pck_status)" >&2
            exit 1
          fi

      - name: Package the preview artifact
        run: |
          mkdir -p exports/web-preview
          cp -R web exports/web-preview/web
          python3 -c 'import pathlib; pathlib.Path("exports/web-preview/README.txt").write_text(
            "Exocomplict — WebAssembly preview build\n"
            "=============================================\n\n"
            "How to run:\n"
            "  1. Extract this archive into the repository root so that the folder 'web/' appears.\n"
            "  2. From the repository root run:  python3 tools/serve_preview.py --port 800\n"
            "  3. Open http://localhost:800/  (landing page) or http://localhost:800/web/ (raw build).\n\n"
            "Details, controls, and limitations: docs/runbooks/WEB_PREVIEW.md\n")'
          du -sh exports/web-preview/web
          find exports/web-preview -maxdepth 2 -type f | sort

      - name: Upload the web preview
        uses: actions/upload-artifact@v4
        with:
          name: web-preview
          path: exports/web-preview
          if-no-files-found: error
          retention-days: 14

      - name: Browser smoke test of the exported build
        run: |
          # Real Chromium from the pinned packages: proves the engine boots with
          # WebGL 2 and that index.wasm/index.pck resolve from both entry pages.
          npm ci --prefix tools --no-audit --no-fund
          # Do not let set -e discard the report when a browser check fails.
          # Per-page error annotations stay readable even when Actions log
          # downloads are unavailable and the whole workflow is still running.
          qa_status=0
          node tools/web_qa.mjs --json > exports/web-qa-report.json || qa_status=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          report_path = Path("exports/web-qa-report.json")
          if not report_path.exists() or not report_path.stat().st_size:
              print("::error title=Web QA report missing::Chromium quit before writing a JSON report")
              raise SystemExit(1)
          report = json.loads(report_path.read_text())
          for page in report["pages"]:
              print(f'{page["target"]}: {"PASS" if not page["failed"] else "FAIL"} | engine: {page["engine"]} | canvas: {page["state"]["canvasSize"]}')
              if page["failed"]:
                  details = [str(item) for item in page["failed"]]
                  details += [str(item) for item in page.get("scriptErrors", [])]
                  details += [str(item) for item in page.get("pageErrors", [])]
                  if page["state"].get("failureText"):
                      details.append(page["state"]["failureText"])
                  print("::error title=Web QA " + page["target"] + "::" + " | ".join(details).replace("\n", " ")[:2000])
          print("::notice title=Web QA (Chromium)" + "::" + " | ".join(
              f'{p["target"]} {"PASS" if not p["failed"] else "FAIL"} ({p["state"]["canvasSize"]}, {p["engine"] or "no engine"})'
              for p in report["pages"]))
          raise SystemExit(0 if report["ok"] else 1)
          PY
          exit "$qa_status"

      - name: Browser secure-context and AudioWorklet preflight
        run: |
          # A real non-loopback HTTP origin must fail before payload download
          # with HTTPS/localhost guidance. A separate secure localhost control
          # removes AudioWorklet and must produce browser guidance, not addModule.
          qa_status=0
          node tools/web_support_qa.mjs --timeout 30 \
            --out exports/web-qa/support --json > exports/web-qa/support-report.json || qa_status=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("exports/web-qa/support-report.json").read_text())
          for case in report["cases"]:
              print(f'{case["name"]}: {"PASS" if case["ok"] else "FAIL"}')
              for failure in case["failures"]:
                  print(f"::error title=Browser support preflight::{failure}")
          raise SystemExit(0 if report["ok"] else 1)
          PY
          exit "$qa_status"

      - name: Browser interrupted-download recovery
        run: |
          # Prove the opening downloads WASM+PCK once before MASUK and DEPLOY
          # reuses those buffers. Then interrupt each asset on a direct selected-
          # world DEPLOY and require a visible retry plus real gameplay recovery.
          qa_status=0
          node tools/web_loading_qa.mjs --throughput-mbps 100 --timeout 150 \
            --out exports/web-qa/loading --json > exports/web-qa/loading-report.json || qa_status=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("exports/web-qa/loading-report.json").read_text())
          opening = report.get("opening")
          if opening is not None:
              print(f'Opening single-download contract: {"PASS" if opening["ok"] else "FAIL"}')
              for failure in opening["failures"]:
                  print("::error title=Opening preload QA::" + failure.replace("\n", " ")[:1800])
          for case in report["cases"]:
              print(f'{case["asset"]} recovery: {"PASS" if case["ok"] else "FAIL"}')
              for failure in case["failures"]:
                  print("::error title=Loading recovery QA::" + failure.replace("\n", " ")[:1800])
          summary = ([] if opening is None else [f'opening {"PASS" if opening["ok"] else "FAIL"}'])
          summary += [f'{case["asset"]} {"PASS" if case["ok"] else "FAIL"}' for case in report["cases"]]
          print("::notice title=Opening and loading recovery::" + " | ".join(summary))
          raise SystemExit(0 if report["ok"] else 1)
          PY
          exit "$qa_status"

      - name: Browser shell world-selection contract
        run: |
          # Drive the real shell: select Vanguard's theatre card, DEPLOY directly,
          # and require both the authoritative handoff and the selected world's
          # runtime build. A default Frostline boot is not a passing substitute.
          qa_status=0
          node tools/web_qa.mjs --page / --viewport 844x390 --timeout 120 \
            --journey --select-vanguard --audio-shell --out exports/web-qa/vanguard \
            --json > exports/web-qa-vanguard-report.json || qa_status=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("exports/web-qa-vanguard-report.json").read_text())
          for page in report["pages"]:
              print(f'Shell world selection: {"PASS" if not page["failed"] else "FAIL"} | {page["target"]}')
              for failure in page["failed"]:
                  print(f"::error title=Shell world selection QA::{failure}")
          raise SystemExit(0 if report["ok"] else 1)
          PY
          exit "$qa_status"

      - name: Browser Titans selection and audio contract
        run: |
          # THE TITANS must pass the same real-gesture audio gate while its own
          # card is selected and its own MissionWorld GLB is built. A Frostline
          # or Vanguard audio pass cannot stand in for this theatre.
          qa_status=0
          node tools/web_qa.mjs --page / --viewport 844x390 --timeout 120 \
            --journey --select-world titans --audio-shell --out exports/web-qa/titans \
            --json > exports/web-qa-titans-report.json || qa_status=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("exports/web-qa-titans-report.json").read_text())
          for page in report["pages"]:
              print(f'Titans selection + audio: {"PASS" if not page["failed"] else "FAIL"} | {page["target"]}')
              for failure in page["failed"]:
                  print(f"::error title=Titans selection + audio QA::{failure}")
          raise SystemExit(0 if report["ok"] else 1)
          PY
          exit "$qa_status"

      - name: Browser ADS mouse and touch contracts
        run: |
          # Pulse is the owned weapon in a fresh profile. Exercise right-mouse
          # hold plus no-lock relative look and two-finger ADS without granting
          # locked weapons or bypassing WeaponController ownership. Engine ADS
          # smoke covers Pulse, Nova and Arc separately; neither that suite nor
          # this no-lock browser look is all-three locked-pointer coverage.
          qa_status=0
          node tools/web_qa.mjs --page / --viewport 1280x720 --timeout 120 \
            --ads --out exports/web-qa/ads-mouse --json \
            > exports/web-qa/ads-mouse-report.json || qa_status=1
          node tools/web_qa.mjs --page / --viewport 844x390 --touch --timeout 120 \
            --ads --out exports/web-qa/ads-touch --json \
            > exports/web-qa/ads-touch-report.json || qa_status=1
          python3 - <<'PY'
          import json
          from pathlib import Path
          ok = True
          for mode in ("mouse", "touch"):
              report = json.loads(Path(f"exports/web-qa/ads-{mode}-report.json").read_text())
              ok = ok and report["ok"]
              for page in report["pages"]:
                  ads = page.get("ads") or {}
                  print(
                      f'Browser ADS {mode}: {"PASS" if not page["failed"] else "FAIL"} | '
                      f'weapon={ads.get("weapon")} aimed={ads.get("aimed")} '
                      f'look={ads.get("lookChanged")} released={ads.get("released")}'
                  )
                  print(
                      f"::notice title=Browser ADS {mode} evidence::"
                      + json.dumps(ads, separators=(",", ":"))
                  )
                  for failure in page["failed"]:
                      print(f"::error title=Browser ADS {mode} QA::{failure}")
          print(f'::notice title=Browser ADS::Pulse mouse hold/no-lock look + touch {"PASS" if ok else "FAIL"}')
          raise SystemExit(0 if ok else 1)
          PY
          exit "$qa_status"

      - name: Browser Recovery engagement contract
        run: |
          # This gate stops at the live guarded state on purpose. Secure,
          # extraction and permanent reward remain engine contracts until a
          # separate real-input browser playthrough proves them.
          qa_status=0
          node tools/web_qa.mjs --page / --viewport 1280x720 --timeout 120 \
            --recovery --out exports/web-qa/recovery --json \
            > exports/web-qa/recovery-report.json || qa_status=1
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("exports/web-qa/recovery-report.json").read_text())
          for page in report["pages"]:
              recovery = page.get("recovery") or {}
              print(
                  f'Browser Recovery engagement: {"PASS" if not page["failed"] else "FAIL"} | '
                  f'engage={recovery.get("engageOffered")} active={recovery.get("guardsActive")} '
                  f'models={recovery.get("guardModels")} locked={recovery.get("secureLocked")}'
              )
              print(
                  "::notice title=Browser Recovery evidence::"
                  + json.dumps(recovery, separators=(",", ":"))
              )
              for failure in page["failed"]:
                  print(f"::error title=Browser Recovery QA::{failure}")
          raise SystemExit(0 if report["ok"] else 1)
          PY
          exit "$qa_status"

      - name: Browser TECH HUNT E2E closure contract
        run: |
          qa_status=0
          node tools/web_qa.mjs --page / --viewport 1280x720 --timeout 180 \
            --recovery-e2e --out exports/web-qa/recovery-e2e --json \
            > exports/web-qa/recovery-e2e-report.json || qa_status=1
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("exports/web-qa/recovery-e2e-report.json").read_text())
          for page in report["pages"]:
              recovery = page.get("recovery") or {}
              e2e = recovery.get("e2e") or {}
              print(
                  f'Browser TECH HUNT E2E: {"PASS" if not page["failed"] else "FAIL"} | '
                  f'cleared={e2e.get("guardsCleared")} secured={e2e.get("blueprintSecured")} '
                  f'banked={e2e.get("runBankedOnce")} tier2={e2e.get("tier2Selected")} '
                  f'redeploy106={e2e.get("redeployedTier2Vitals106")}'
              )
              print(
                  "::notice title=Browser TECH HUNT E2E evidence::"
                  + json.dumps(e2e, separators=(",", ":"))
              )
              for failure in page["failed"]:
                  print(f"::error title=Browser TECH HUNT E2E::{failure}")
          raise SystemExit(0 if report["ok"] else 1)
          PY
          exit "$qa_status"

      - name: Upload the web QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-qa
          path: exports/web-qa
          if-no-files-found: warn
          retention-days: 14

      - name: Stage the web export templates for offline builds
        run: |
          # Mirror the Scary-Night layout: keep the *web* export templates in the
          # repository so a local export needs no 1.2 GB template download.
          templates_root="${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates"
          version_dir="$(find "$templates_root" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort | tail -n 1)"
          echo "templates directory: ${version_dir:-<none>}"
          mkdir -p engine/web_templates
          staged=0
          for name in web_nothreads_release.zip web_nothreads_debug.zip web_release.zip web_debug.zip; do
            if [[ -n "$version_dir" && -f "$version_dir/$name" ]]; then
              cp "$version_dir/$name" "engine/web_templates/$name"
              staged=$((staged + 1))
            fi
          done
          echo "staged $staged template archive(s)"
          ls -lh engine/web_templates || true
          echo "::notice title=Web export templates staged::${staged} archive(s) in engine/web_templates"

      - name: Opt in to a payload and template history commit
        # The artifact is produced and tested on every run. Writing 90+ MB of
        # generated binaries back into Git is reserved for an explicit source
        # commit marker, so ordinary pulls do not fetch a new PCK every time.
        if: >-
          github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[web-payload]') &&
          !contains(github.event.head_commit.message, '[skip ci]')
        run: |
          pck_bytes="$(stat -c %s web/index.pck)"
          if (( pck_bytes >= 100000000 )); then
            echo "::error title=Payload exceeds the plain-clone budget::web/index.pck is ${pck_bytes} bytes; keep the committed non-LFS PCK below 100000000 bytes so GitHub accepts it and a bare clone remains playable"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in web engine/web_templates; do
            [[ -e "$path" ]] && git add "$path"
          done
          if git diff --cached --quiet; then
            echo "Payload and templates are unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Refresh the committed web payload and templates [skip ci]" \
            -m "Exported by the web-preview job of run ${GITHUB_RUN_ID} from ${GITHUB_SHA:0:7}." \
            -m "Generated output only; no source changes belong here."
          # The job log is not always retrievable through the API, so whatever
          # decides this step is echoed as an annotation as well.
          state() { git status --short | tr '\n' '|'; }
          echo "::notice title=Payload commit::worktree=$(state)"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            # Parallel CI runs must not replace a newer source build with a
            # stale PCK. Only bot-generated payload commits may be rebased over.
            if [[ -n "$(git log --format=%H "${GITHUB_SHA}..origin/${GITHUB_REF_NAME}" \
              -- . ':(exclude)web' ':(exclude)engine/web_templates' | head -n 1)" ]]; then
              echo "::notice title=Stale preview skipped::A newer source commit needs its own Web export"
              exit 0
            fi
            # autoStash: the export leaves machine-local files behind in the
            # worktree, and rebase refuses to start on a dirty tree.
            # -X theirs: the only files that can conflict here are the binary
            # payload and the templates, and this run's fresh export is the
            # newer truth for both.
            if git -c rebase.autoStash=true rebase -X theirs "origin/${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "::warning title=Payload push retry ${attempt}::$(state)"
            git rebase --abort 2>/dev/null || true
            sleep 4
          done
          echo "::error title=Preview push failed::$(state)"
          exit 1

      - name: Publish web preview summary
        if: always()
        run: |
          {
            echo '## Web preview (WebAssembly)'
            echo 'Download the `web-preview` artifact, extract it into the repository root, then run:'
            echo '```bash'
            echo 'python3 tools/serve_preview.py --port 800'
            echo '```'
            echo 'Open `http://localhost:800/`. See `docs/runbooks/WEB_PREVIEW.md` for details and limitations.'
            if [[ -f exports/web-preview/web/index.pck ]]; then
              echo
              echo 'Build payload:'
              echo '```'
              ls -lh exports/web-preview/web | sed 's/^/  /'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -f exports/web-preview/web/index.pck ]]; then
            total="$(du -sh exports/web-preview/web | cut -f1)"
            echo "::notice title=Web preview artifact::web/ totals ${total}; artifact 'web-preview' is ready to download"
          fi

  deploy-pages:
    name: Publish web preview to GitHub Pages
    # Manual dispatch (any branch) or automatic after a push to main.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: web-preview
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download the web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-preview
          path: artifacts

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -R artifacts/web site/web
          cp index.html site/index.html
          # The player front end (ui/) is part of the landing page: its tokens,
          # styles, self-hosted fonts and shell script must ship beside it.
          cp -R ui site/ui
          # The landing page loads ./web/index.html, which is valid on Pages too.
          grep -q "web/index.html" site/index.html
          grep -q "ui/shell.js" site/index.html
          touch site/.nojekyll   # serve files verbatim, skip Jekyll
          echo "site contents:"
          find site -maxdepth 2 -type f -printf '%P %s bytes\n' | sort
          du -sh site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish the preview URL
        if: always()
        run: |
          {
            echo '## Web preview URL'
            echo
            echo "Pages deployment: \`${{ steps.deployment.outputs.page_url }}\`"
            echo
            echo 'Open that URL in a browser to play the WebAssembly build; no download or local server needed.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Web preview URL::${{ steps.deployment.outputs.page_url }}"

  lfs-assets:
    name: Inspect the LFS asset archive
    # Dispatch-only in spirit: GitHub will not run workflow_dispatch for a
    # workflow that only exists on a side branch, so the trigger is a marker in
    # the commit message. The 259 MB pack is an LFS pointer the development
    # sandbox cannot resolve; a runner can, and this job writes down what is
    # actually inside it.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[lfs-inspect]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify the archive resolved
        run: |
          ls -lh 3DScifiStarterKitFree.zip
          size=$(stat -c%s 3DScifiStarterKitFree.zip)
          echo "size=$size"
          if [ "$size" -lt 100000000 ]; then
            echo "::error title=LFS object not fetched::the zip is $size bytes, which is still the pointer"
            exit 1
          fi
          sha256sum 3DScifiStarterKitFree.zip

      - name: Write the manifest
        run: |
          mkdir -p docs
          out=docs/ARCHITECTURE.md
          {
            echo "# Manifest of \`3DScifiStarterKitFree.zip\`"
            echo
            echo "Generated on a GitHub runner from the LFS object, $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo "Archive size: $(stat -c%s 3DScifiStarterKitFree.zip) bytes."
            echo
            echo "## By extension"
            echo
            echo '| Extension | Files | Uncompressed bytes |'
            echo '|---|---:|---:|'
            unzip -l 3DScifiStarterKitFree.zip \
              | awk 'NR>3 && NF>=4 {n=$4; for(i=5;i<=NF;i++) n=n" "$i;
                     if (n ~ /\/$/) next;
                     ext="(none)"; if (match(n, /\.[^.\/]+$/)) ext=tolower(substr(n, RSTART+1));
                     count[ext]++; bytes[ext]+=$1}
                     END {for (e in count) printf "%s\t%d\t%d\n", e, count[e], bytes[e]}' \
              | sort -t$'\t' -k2,2nr \
              | while IFS=$'\t' read -r ext n b; do echo "| \`$ext\` | $n | $b |"; done
            echo
            echo "## Directories"
            echo
            echo '| Top-level path | Files |'
            echo '|---|---:|'
            unzip -l 3DScifiStarterKitFree.zip \
              | awk 'NR>3 && NF>=4 {n=$4; for(i=5;i<=NF;i++) n=n" "$i;
                     if (n ~ /\/$/) next;
                     split(n, parts, "/"); if (length(parts) == 1) top="(root)"; else top=parts[1];
                     count[top]++}
                     END {for (d in count) printf "%s\t%d\n", d, count[d]}' \
              | sort -t$'\t' -k2,2nr \
              | while IFS=$'\t' read -r d n; do echo "| \`$d\` | $n |"; done
            echo
            echo "## Every model file"
            echo
            echo '| Model | Compressed bytes |'
            echo '|---|---:|'
            unzip -l 3DScifiStarterKitFree.zip \
              | awk 'NR>3 && NF>=4 {n=$4; for(i=5;i<=NF;i++) n=n" "$i;
                     if (tolower(n) ~ /\.(fbx|obj|glb|gltf|blend|max)$/) printf "%s\t%d\n", n, $1}' \
              | sort \
              | while IFS=$'\t' read -r f b; do echo "| \`$f\` | $b |"; done
            echo
            echo "## Every texture"
            echo
            echo '| Texture | Compressed bytes |'
            echo '|---|---:|'
            unzip -l 3DScifiStarterKitFree.zip \
              | awk 'NR>3 && NF>=4 {n=$4; for(i=5;i<=NF;i++) n=n" "$i;
                     if (n ~ /\.(png|jpg|jpeg|tga|tif|tiff|exr|hdr)$/) printf "%s\t%d\n", n, $1}' \
              | sort \
              | while IFS=$'\t' read -r f b; do echo "| \`$f\` | $b |"; done
          } > "$out"
          wc -l "$out"
          head -60 "$out"

      - name: Commit the manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ARCHITECTURE.md
          if git diff --cached --quiet; then
            echo "Manifest unchanged."
            exit 0
          fi
          git commit -m "Add the LFS archive manifest [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  lfs-convert:
    name: Convert the LFS FBX pack to GLB
    # The 259 MB pack is an LFS pointer. Neither the sandbox this branch is
    # developed in nor `gh run download` can reach the LFS/artifact hosts, so
    # the only channel back is git itself. This job resolves the archive on the
    # runner, converts the FBX models to self-contained GLB with 512 px
    # textures packed in, and commits the result. Triggered by the marker
    # because GitHub refuses workflow_dispatch for workflows that only exist on
    # a side branch.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[lfs-pack]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Install Blender
        run: |
          # The apt build on ubuntu-latest ships without numpy, which the FBX
          # importer needs, so the blender.org tarball is the reliable path.
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy
          if ! blender --background --factory-startup --python-expr "import numpy" >/tmp/blender-check.log 2>&1; then
            echo "apt Blender cannot import numpy; using the official tarball"
            curl -fsSL https://download.blender.org/release/Blender4.2/ \
              | grep -o 'blender-4\.2\.[0-9]*-linux-x64\.tar\.xz' | sort -u | tail -1 > /tmp/blender-name.txt
            name=$(cat /tmp/blender-name.txt)
            echo "downloading $name"
            curl -fsSL -o /tmp/blender.tar.xz "https://download.blender.org/release/Blender4.2/$name"
            tar -xf /tmp/blender.tar.xz -C /tmp
            echo "BLENDER_BIN=$(find /tmp -maxdepth 2 -name blender -type f | head -1)" >> "$GITHUB_ENV"
          else
            echo "BLENDER_BIN=blender" >> "$GITHUB_ENV"
          fi
          "$BLENDER_BIN" --version | head -3

      - name: Unpack the archive
        run: |
          size=$(stat -c%s 3DScifiStarterKitFree.zip)
          echo "zip is $size bytes"
          test "$size" -gt 100000000
          mkdir -p /tmp/pack
          unzip -q 3DScifiStarterKitFree.zip -d /tmp/pack
          find /tmp/pack -type f -iname '*.fbx' | wc -l
          find /tmp/pack -type d | head -20

      - name: Convert FBX to GLB
        run: |
          mkdir -p game/assets/world/scifi_starter_kit/models
          "$BLENDER_BIN" --background --factory-startup --python tools/convert_fbx_pack.py -- \
            /tmp/pack game/assets/world/scifi_starter_kit/models \
            --texture-size 512 2>&1 | tail -40
          ls -la game/assets/world/scifi_starter_kit/models | head
          du -sh game/assets/world/scifi_starter_kit/models
          count=$(find game/assets/world/scifi_starter_kit/models -name '*.glb' | wc -l)
          echo "converted $count models"
          if [ "$count" -lt 1 ]; then
            echo "::error title=Conversion produced nothing::see the Blender log above"
            exit 1
          fi

      - name: Write the manifest
        run: |
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path("game/assets/world/scifi_starter_kit/models")
          files = sorted(p.name for p in root.glob("*.glb"))
          data = {
              "source": "3DScifiStarterKitFree.zip",
              "generator": "tools/convert_fbx_pack.py (Blender glTF exporter)",
              "texture_size": 512,
              "models": files,
          }
          (root.parent / "manifest.json").write_text(json.dumps(data, indent=2) + "\n")
          print(len(files), "models")
          PY

      - name: Commit the converted models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/assets/world/scifi_starter_kit
          if git diff --cached --quiet; then
            echo "Nothing converted."
            exit 0
          fi
          git commit -m "Convert the uploaded FBX pack to GLB [skip ci]" \
            -m "Blender conversion on a runner that can fetch the LFS object; textures are packed at 512 px."
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

  hero-blender:
    name: Inspect and author hero in Blender
    # workflow_dispatch does not trigger from an unmerged branch on GitHub.
    # Explicit marker on our fixed branch runs this expensive authoring pass.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/arena/5257bce8-cyber-strike' &&
      contains(github.event.head_commit.message, '[hero-blender]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Blender and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy
          blender --background --factory-startup --python-expr 'import bpy, numpy; print(bpy.app.version_string)'

      - name: Inspect real GLBs and author motion clips
        run: |
          mkdir -p exports
          set +e
          # Blender otherwise returns 0 even if the Python script raises.
          blender --background --factory-startup --python-exit-code 1 \
            --python tools/blender/author_hero.py > exports/blender-hero.log 2>&1
          status=$?
          set -e
          tail -n 35 exports/blender-hero.log
          if [[ "$status" -ne 0 ]]; then
            digest="$( (grep -E 'Traceback|RuntimeError|Error:|ValueError|AttributeError' exports/blender-hero.log || true) | tail -n 4 | tr '\n' '|' )"
            if [[ -z "$digest" ]]; then
              digest="$(tail -n 8 exports/blender-hero.log | tr '\n' '|' )"
            fi
            echo "::error title=Blender hero failed::${digest:-check logs}"
            exit "$status"
          fi
          for required in source-assets/characters/hero/hero_source.blend docs/asset-inspections/hero-blender.json; do
            if [[ ! -s "$required" ]]; then
              echo "::error title=Blender output missing::$required was not generated"
              exit 1
            fi
          done

      - name: Verify exported hero in Godot before publication
        run: |
          ./scripts/install_godot.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          set +e
          GODOT_BIN="$HOME/.local/bin/godot" SMOKE_TEST_TIMEOUT=60 \
            ./scripts/run_smoke_tests.sh hero_rig_smoke combat_feedback_smoke effects_smoke
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            for log in exports/test-logs/import.log exports/test-logs/hero_rig_smoke.log; do
              [[ -f "$log" ]] || continue
              digest="$( (grep -iE 'hero.glb|missing|ERROR:|Parse Error|failed:' "$log" || true) | head -n 7 | tr '\n' '|')"
              echo "::error title=Blender hero Godot validation::$(basename "$log"): ${digest:-no diagnostic lines}"
            done
            exit "$status"
          fi

      - name: Publish Blender source and tested GLB on the fixed branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-assets/characters/hero/hero_source.blend \
            game/assets/characters/hero/hero.glb docs/asset-inspections/hero-blender.json
          git diff --cached --check
          git commit -m 'Build and inspect hero motion in Blender' \
            -m 'Includes the .blend source and exported clips. Headless Godot smoke checks ran; human motion review remains open.'
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

  # The asset forge exports 36 GLBs and proves them spec-valid with the Khronos
  # validator, but only an engine can say whether Godot imports them. This job
  # runs the real importer and the forge's own verifier, then commits the
  # machine-readable report back to the branch — the same way the lfs-convert and
  # hero-blender jobs return their results, because the artifact/log hosts are not
  # reachable from the development sandbox.
  #
  # Trigger: commit-message marker `[forge-verify]` (workflow_dispatch does not
  # fire for workflows that only exist on a side branch).
  forge-verify:
    name: Verify forged GLBs import in Godot
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[forge-verify]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install runtime libraries for Godot
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libxi6 libxcursor1 libxinerama1 libxrandr2 libxkbcommon0 || \
            echo "Some optional libraries were unavailable; continuing."

      - name: Install pinned Godot editor
        run: |
          ./scripts/install_godot.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report engine version
        run: godot --version

      - name: Confirm the staged assets are present
        run: |
          count=$(find game/assets/forge -name '*.glb' | wc -l | tr -d ' ')
          echo "staged GLBs: $count"
          if [[ "$count" -lt 1 ]]; then
            echo "::error title=No staged assets::run node tools/asset-forge/gate/stage_world_into_game.mjs"
            exit 1
          fi
          test -f game/assets/forge/forge_manifest.json

      - name: Import the project (headless)
        run: |
          mkdir -p exports
          godot --headless --path game --import 2>&1 | tee exports/forge-import.log | tail -30 || true
          # A GLB that fails to import leaves no .import file behind.
          missing=0
          while IFS= read -r glb; do
            if [[ ! -f "${glb}.import" ]]; then
              echo "::error title=GLB did not import::$glb has no .import file"
              missing=$((missing + 1))
            fi
          done < <(find game/assets/forge -name '*.glb')
          echo "GLBs without .import: $missing"

      - name: Verify every forged asset in the engine
        run: |
          cp tools/asset-forge/godot/verify_import.gd game/verify_import.gd
          mkdir -p qa-evidence/forge
          set +e
          FORGE_REPORT="$PWD/qa-evidence/forge/import-report.json" \
            godot --headless --path game --script res://verify_import.gd 2>&1 | tee exports/forge-verify.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ -f qa-evidence/forge/import-report.json ]]; then
            python3 - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path("qa-evidence/forge/import-report.json").read_text())
          print(f"checked {report['checked']} · passed {report['passed']} · failed {report['failed']}")
          for row in report["rows"]:
              mark = "PASS" if row["ok"] else "FAIL"
              print(f'{mark} {row["id"]:<26} {row.get("height_m", 0):6.3f} m  '
                    f'clips {len(row.get("clips", []))}  sockets {len(row.get("sockets", []))}')
          for problem in report["failures"][:12]:
              print(f'::error title=Forge verify::{problem[:400]}')
          print('::notice title=Forge verify (' + report['godot'] + ')::'
                + f'{report["passed"]}/{report["checked"]} assets imported and matched the manifest')
          PY
          fi
          exit "$status"

      - name: Commit the report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa-evidence/forge exports/forge-verify.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Record the in-engine forge import report [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

  # Every hero's celebration is authored in Blender, separately from the hero
  # export itself: the hero art is locked, so this job may add animation files
  # but never rewrite hero.glb. Same opt-in marker pattern as hero-blender, and
  # the same reason for the branch check (workflow_dispatch does not trigger
  # from an unmerged branch).
  hero-celebrations:
    name: Author hero celebrations in Blender
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/arena/') &&
      contains(github.event.head_commit.message, '[celebration]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Blender and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy
          blender --background --factory-startup --python-expr 'import bpy, numpy; print(bpy.app.version_string)'

      - name: Author one celebration per hero
        run: |
          mkdir -p exports
          set +e
          # Blender returns 0 even when the Python script raises.
          blender --background --factory-startup --python-exit-code 1 \
            --python tools/blender/author_celebrations.py > exports/blender-celebrations.log 2>&1
          status=$?
          set -e
          tail -n 35 exports/blender-celebrations.log
          if [[ "$status" -ne 0 ]]; then
            digest="$( (grep -E 'Traceback|RuntimeError|Error:|ValueError|AttributeError' exports/blender-celebrations.log || true) | tail -n 4 | tr '\n' '|' )"
            if [[ -z "$digest" ]]; then
              digest="$(tail -n 8 exports/blender-celebrations.log | tr '\n' '|')"
            fi
            echo "::error title=Blender celebrations failed::${digest:-check logs}"
            exit "$status"
          fi
          for required in game/assets/characters/hero/celebrations/manifest.json \
                          game/assets/characters/hero/celebrations/exo_operative.glb \
                          docs/asset-inspections/celebrations.json; do
            if [[ ! -s "$required" ]]; then
              echo "::error title=Blender celebration output missing::$required was not generated"
              exit 1
            fi
          done

      - name: Confirm the locked hero export was not rewritten
        run: |
          if ! git diff --quiet -- game/assets/characters/hero/hero.glb; then
            echo "::error title=Locked hero art changed::hero.glb was modified; celebrations must only add files"
            exit 1
          fi

      - name: Publish celebration clips on the branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/assets/characters/hero/celebrations \
            docs/asset-inspections/celebrations.json \
            source-assets/characters/hero/hero_celebrations.blend
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No celebration changes to publish."
            exit 0
          fi
          git commit -m 'Author hero celebrations in Blender' \
            -m 'One animation-only GLB per hero under game/assets/characters/hero/celebrations. hero.glb is untouched by design: the hero art is locked.'
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
