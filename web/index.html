<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Exocomplict</title>
		<!--
			Exocomplict custom Godot 4 Web shell.

			This file is exported by Godot through the "html/custom_html_shell"
			export option (see tools/web_preset.py). Godot substitutes the
			dollar-prefixed GODOT_* placeholders at export time; the marker names
			are documented here without their prefix so that this comment is never
			mistaken for an unsubstituted placeholder:

			  GODOT_PROJECT_NAME      project name from project.godot
			  GODOT_URL               path of the exported JS library (index.js)
			  GODOT_CONFIG            engine configuration object
			  GODOT_THREADS_ENABLED   "true"/"false" for the chosen variant
			  GODOT_HEAD_INCLUDE      extra markup from the export preset
			  GODOT_SPLASH / GODOT_SPLASH_CLASSES   boot splash image and classes

			The shell draws nothing over the engine canvas. It used to carry a
			browser chrome bar (an UI toggle, a product chip, Fullscreen, Hide UI)
			and a controls legend behind a second toggle; in a screenshot that bar
			was the first thing the eye found, and it made a running game look like
			a page hosting one. The HUD, the pause menu and the results card are the
			engine's own screens, so every control a player needs is already inside
			the frame. Web exports run on the Compatibility renderer, so WebGL 2 is
			required -- but the browser chrome does not say so either: a player
			reads the game's name and nothing about how it was built.
		-->
		<style>
			html, body, #canvas {
				margin: 0;
				padding: 0;
				border: 0;
			}

			html, body {
				width: 100%;
				height: 100%;
				overflow: hidden;
				background-color: #05070d;
			}

			body {
				color: #e6f1ff;
				font-family: 'Segoe UI', 'Noto Sans', Arial, sans-serif;
				touch-action: none;
				-webkit-tap-highlight-color: transparent;
			}

			#canvas {
				display: block;
				width: 100%;
				height: 100%;
				outline: none;
				background-color: #05070d;
			}

			/* ---------- boot overlay ---------- */
			#status {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				gap: 1.1rem;
				background:
					radial-gradient(circle at 50% 30%, rgba(24, 68, 110, 0.55), rgba(5, 7, 13, 0.98) 70%),
					#05070d;
				z-index: 20;
			}

			#status-splash {
				max-height: 34vh;
				max-width: 60vw;
				image-rendering: pixelated;
			}

			#status-splash.fullsize--true {
				height: 100%;
				width: 100%;
				object-fit: contain;
			}

			#status.loaded {
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
				transition: opacity 260ms ease-out;
			}

			.boot-title {
				letter-spacing: 0.42em;
				text-transform: uppercase;
				font-size: 0.82rem;
				color: #7fd8ff;
				text-shadow: 0 0 12px rgba(48, 178, 255, 0.55);
			}

			.boot-note {
				font-size: 0.78rem;
				color: #8ea3b8;
				max-width: 34rem;
				text-align: center;
				line-height: 1.5;
				padding: 0 1rem;
			}

			#status-progress {
				width: min(52vw, 420px);
				height: 8px;
				appearance: none;
				border-radius: 999px;
				overflow: hidden;
				background: rgba(127, 216, 255, 0.14);
				border: 1px solid rgba(127, 216, 255, 0.28);
			}

			#status-progress::-webkit-progress-bar {
				background: transparent;
			}

			#status-progress::-webkit-progress-value {
				background: linear-gradient(90deg, #24d3ff, #7cffcb);
			}

			#status-progress::-moz-progress-bar {
				background: linear-gradient(90deg, #24d3ff, #7cffcb);
			}

			#status-progress-label {
				font-variant-numeric: tabular-nums;
				font-size: 0.76rem;
				color: #7fd8ff;
			}

			#status-notice {
				display: none;
				max-width: min(46rem, 88vw);
				margin: 0 1rem;
				padding: 0.9rem 1.1rem;
				border-radius: 0.6rem;
				border: 1px solid #9b3943;
				background-color: #5b3943;
				color: #ffe9e9;
				font-size: 0.82rem;
				line-height: 1.45;
				text-align: center;
				white-space: pre-wrap;
				z-index: 21;
			}

		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body id="exocomplict-shell">
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<!--
			The boot overlay is a dark frame, and nothing else.

			It used to hold a product wordmark, a progress bar and a sentence about
			the engine build. That is a developer's view of a download, and it was
			the first thing a player ever saw of this game: a page explaining
			itself, on the screen where the film should be. The ident runs in the
			engine a couple of seconds after this frame, so this frame's only job
			is not to be in the way. It fades the moment the engine reports ready.

			The progress elements stay in the DOM because the engine's loader
			writes to them; they are hidden, not removed, and an error notice is
			still shown if the load fails.
		-->
		<div id="status">
			<!-- Kept for the export contract and hidden: the engine's boot splash
			     is a placeholder image, and this project's opening is its own
			     boot stage, not a splash screen. -->
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="" hidden>
			<progress id="status-progress" hidden></progress>
			<div id="status-progress-label" hidden></div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":32689936,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusProgressLabel = document.getElementById('status-progress-label');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			// Loading set an inline visibility:visible. Clear it before relying
			// on #status.loaded, otherwise the transparent splash still captures
			// every pointer click and leaves the Godot canvas unfocused.
			statusOverlay.style.removeProperty('visibility');
			statusOverlay.classList.add('loaded');
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					statusProgressLabel.textContent = Math.floor((current / total) * 100) + '% loaded';
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					statusProgressLabel.textContent = 'loading…';
				}
			},
		}).then(() => {
			statusProgressLabel.textContent = 'starting…';
			setStatusMode('hidden');
			// Nothing is layered over the canvas: the first frame of gameplay is
			// the frame the engine drew.
			document.getElementById('canvas').focus();
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
